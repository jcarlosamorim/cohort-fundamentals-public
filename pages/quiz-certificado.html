                    </div>
                    <div style="font-family: var(--font-mono); font-weight: 800; font-size: 1.5rem; color: #22C55E;">75%</div>
                    <div style="font-size: 0.7rem; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.08em;">Nota minima</div>

                    <div style="font-family: var(--font-mono); font-weight: 800; font-size: 1.5rem; color: #0099FF;">&infin;</div>
                    <div style="font-size: 0.7rem; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.08em;">Tentativas</div>
                </div>

                <!-- Certificado -->
                <div style="background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 1.25rem; text-align: center;">
