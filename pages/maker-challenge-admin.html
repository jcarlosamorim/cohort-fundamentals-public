<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maker Challenge — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      background: var(--color-bg-primary);
      color: var(--color-text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Layout ── */
    .page { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

    /* ── Header ── */
    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .admin-header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .admin-header h1 svg { width: 24px; height: 24px; color: var(--color-maker); }

    /* ── Login Gate ── */
    .login-gate {
      max-width: 400px;
      margin: 4rem auto;
      text-align: center;
    }

    .login-gate h2 { margin-bottom: 1.5rem; font-size: 1.3rem; }

    .login-field {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .login-field input {
      flex: 1;
      padding: 0.7rem 0.9rem;
      background: var(--color-bg-card);
      border: 1px solid var(--color-border-light);
      border-radius: var(--radius-sm);
      color: var(--color-text-primary);
      font-family: var(--font-family);
      font-size: 0.9rem;
    }

    .login-field input:focus { outline: none; border-color: var(--color-maker); }

    .btn {
      padding: 0.7rem 1.5rem;
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-family);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--color-maker);
      color: #000;
    }

    .btn-primary:hover { opacity: 0.9; }

    .btn-ghost {
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      color: var(--color-text-secondary);
    }

    .btn-ghost:hover { border-color: var(--color-border-light); }

    .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.8rem; }

    .login-error {
      color: var(--color-danger);
      font-size: 0.85rem;
      display: none;
    }

    /* ── Stats Bar ── */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 1rem 1.25rem;
      text-align: center;
    }

    .stat-card .stat-value {
      font-size: 1.8rem;
      font-weight: 800;
      font-family: var(--font-mono);
      color: var(--color-text-primary);
    }

    .stat-card .stat-label {
      font-size: 0.75rem;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-card.highlight .stat-value { color: var(--color-maker); }
    .stat-card.green .stat-value { color: var(--color-accent-green); }
    .stat-card.purple .stat-value { color: var(--color-accent-purple); }

    /* ── Filters ── */
    .filters {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 0.4rem 0.9rem;
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: 999px;
      color: var(--color-text-secondary);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover { border-color: var(--color-border-light); }
    .filter-btn.active { background: var(--color-maker-10); border-color: var(--color-maker); color: var(--color-maker); }

    /* ── Table ── */
    .table-wrap {
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    thead { background: var(--color-bg-elevated); }

    th {
      text-align: left;
      padding: 0.75rem 1rem;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-text-muted);
      border-bottom: 1px solid var(--color-border);
    }

    td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--color-border);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }

    tr:hover td { background: var(--color-white-5); }

    /* ── Phase Badge ── */
    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .badge-applied { background: var(--color-info-10); color: var(--color-info); }
    .badge-approved { background: var(--color-accent-green-10); color: var(--color-accent-green); }
    .badge-sprint_active { background: var(--color-maker-10); color: var(--color-maker); }
    .badge-submitted { background: var(--color-accent-purple-10); color: var(--color-accent-purple); }
    .badge-evaluated { background: var(--color-accent-gold-10); color: var(--color-accent-gold); }
    .badge-rejected { background: var(--color-danger-10); color: var(--color-danger); }

    /* ── Verdict Badge ── */
    .verdict-maker_confirmed { background: var(--color-accent-green-10); color: var(--color-accent-green); }
    .verdict-needs_development { background: var(--color-warning-10); color: var(--color-warning); }
    .verdict-not_maker { background: var(--color-danger-10); color: var(--color-danger); }

    /* ── Commitment Bar ── */
    .commitment-bar {
      width: 60px;
      height: 6px;
      background: var(--color-border);
      border-radius: 3px;
      display: inline-block;
      vertical-align: middle;
      margin-right: 0.5rem;
    }

    .commitment-fill {
      height: 100%;
      border-radius: 3px;
      background: var(--color-maker);
    }

    /* ── Detail Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-overlay.visible { display: flex; }

    .modal {
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      max-width: 600px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 2rem;
    }

    .modal h2 {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--color-text-muted);
      cursor: pointer;
      padding: 0.25rem;
    }

    .modal-close:hover { color: var(--color-text-primary); }

    .detail-grid {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 0.5rem 1rem;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }

    .detail-label {
      color: var(--color-text-muted);
      font-weight: 500;
    }

    .detail-value { color: var(--color-text-primary); }
    .detail-value.mono { font-family: var(--font-mono); }

    .detail-divider {
      grid-column: 1 / -1;
      border-top: 1px solid var(--color-border);
      margin: 0.5rem 0;
    }

    /* ── Scoring Form ── */
    .score-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .score-field label {
      display: block;
      font-size: 0.8rem;
      color: var(--color-text-muted);
      margin-bottom: 0.3rem;
    }

    .score-field input {
      width: 100%;
      padding: 0.5rem;
      background: var(--color-bg-primary);
      border: 1px solid var(--color-border-light);
      border-radius: var(--radius-sm);
      color: var(--color-text-primary);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      text-align: center;
    }

    .score-field input:focus { outline: none; border-color: var(--color-maker); }

    .verdict-select {
      width: 100%;
      padding: 0.6rem;
      background: var(--color-bg-primary);
      border: 1px solid var(--color-border-light);
      border-radius: var(--radius-sm);
      color: var(--color-text-primary);
      font-family: var(--font-family);
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
      cursor: pointer;
      appearance: none;
    }

    .verdict-select:focus { outline: none; border-color: var(--color-maker); }

    .notes-textarea {
      width: 100%;
      padding: 0.6rem;
      background: var(--color-bg-primary);
      border: 1px solid var(--color-border-light);
      border-radius: var(--radius-sm);
      color: var(--color-text-primary);
      font-family: var(--font-family);
      font-size: 0.85rem;
      resize: vertical;
      min-height: 80px;
      margin-bottom: 1rem;
    }

    .notes-textarea:focus { outline: none; border-color: var(--color-maker); }

    .modal-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
    }

    /* ── Empty State ── */
    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--color-text-muted);
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .page { padding: 1rem; }
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
      .table-wrap { overflow-x: auto; }
      table { min-width: 700px; }
      .score-grid { grid-template-columns: 1fr; }
      .detail-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- Login Gate -->
    <div id="login-gate" class="login-gate">
      <h2>Maker Challenge Admin</h2>
      <div class="login-field">
        <input type="email" id="login-email" placeholder="Email">
        <input type="password" id="login-password" placeholder="Senha">
      </div>
      <button class="btn btn-primary" onclick="doLogin()" style="width:100%">Entrar</button>
      <p class="login-error" id="login-error">Email ou senha incorretos</p>
    </div>

    <!-- Admin Content (hidden until login) -->
    <div id="admin-content" style="display:none">

      <header class="admin-header">
        <h1>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
          Maker Challenge — Admin
        </h1>
        <div style="display:flex;gap:0.5rem">
          <button class="btn btn-ghost btn-sm" onclick="loadData()">Atualizar</button>
          <button class="btn btn-ghost btn-sm" onclick="doLogout()">Sair</button>
        </div>
      </header>

      <!-- Stats -->
      <div class="stats-bar" id="stats-bar">
        <div class="stat-card highlight"><div class="stat-value" id="stat-total">0</div><div class="stat-label">Total</div></div>
        <div class="stat-card"><div class="stat-value" id="stat-applied">0</div><div class="stat-label">Candidatos</div></div>
        <div class="stat-card green"><div class="stat-value" id="stat-approved">0</div><div class="stat-label">Aprovados</div></div>
        <div class="stat-card purple"><div class="stat-value" id="stat-submitted">0</div><div class="stat-label">Entregaram</div></div>
        <div class="stat-card"><div class="stat-value" id="stat-confirmed">0</div><div class="stat-label">Makers</div></div>
      </div>

      <!-- Filters -->
      <div class="filters">
        <button class="filter-btn active" data-filter="all">Todos</button>
        <button class="filter-btn" data-filter="applied">Candidatos</button>
        <button class="filter-btn" data-filter="approved">Aprovados</button>
        <button class="filter-btn" data-filter="sprint_active">Sprint Ativo</button>
        <button class="filter-btn" data-filter="submitted">Entregaram</button>
        <button class="filter-btn" data-filter="evaluated">Avaliados</button>
        <button class="filter-btn" data-filter="rejected">Rejeitados</button>
      </div>

      <!-- Table -->
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Email</th>
              <th>Horas/sem</th>
              <th>Compromisso</th>
              <th>72h?</th>
              <th>Fase</th>
              <th>Acoes</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr><td colspan="7" class="empty-state">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal-content"></div>
  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script>
    var sb = window.supabase.createClient(Config.SUPABASE_URL, Config.SUPABASE_ANON_KEY);
    var allData = [];
    var currentFilter = 'all';

    // ── Login ──
    async function doLogin() {
      var email = document.getElementById('login-email').value.trim();
      var password = document.getElementById('login-password').value;
      var errEl = document.getElementById('login-error');
      errEl.style.display = 'none';

      var result = await sb.auth.signInWithPassword({ email: email, password: password });
      if (result.error) {
        errEl.style.display = 'block';
        return;
      }

      document.getElementById('login-gate').style.display = 'none';
      document.getElementById('admin-content').style.display = 'block';
      loadData();
    }

    async function doLogout() {
      await sb.auth.signOut();
      location.reload();
    }

    // Check existing session
    sb.auth.getSession().then(function(res) {
      if (res.data.session) {
        document.getElementById('login-gate').style.display = 'none';
        document.getElementById('admin-content').style.display = 'block';
        loadData();
      }
    });

    // Enter key on login
    document.getElementById('login-password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') doLogin();
    });

    // ── Load Data ──
    async function loadData() {
      var result = await sb.from('maker_challenge').select('*').order('created_at', { ascending: false });
      if (result.error) { console.error(result.error); return; }
      allData = result.data || [];
      updateStats();
      renderTable();
    }

    function updateStats() {
      document.getElementById('stat-total').textContent = allData.length;
      document.getElementById('stat-applied').textContent = allData.filter(function(r) { return r.phase === 'applied'; }).length;
      document.getElementById('stat-approved').textContent = allData.filter(function(r) { return ['approved','sprint_active','submitted','evaluated'].includes(r.phase); }).length;
      document.getElementById('stat-submitted').textContent = allData.filter(function(r) { return ['submitted','evaluated'].includes(r.phase); }).length;
      document.getElementById('stat-confirmed').textContent = allData.filter(function(r) { return r.verdict === 'maker_confirmed'; }).length;
    }

    // ── Filters ──
    document.querySelectorAll('.filter-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderTable();
      });
    });

    // ── Render Table ──
    function renderTable() {
      var tbody = document.getElementById('table-body');
      var filtered = currentFilter === 'all' ? allData : allData.filter(function(r) { return r.phase === currentFilter; });

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Nenhum candidato encontrado</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(function(r) {
        var commitPct = (r.commitment_level / 10 * 100) + '%';
        return '<tr>' +
          '<td><strong>' + esc(r.name) + '</strong></td>' +
          '<td style="font-size:0.8rem;color:var(--color-text-secondary)">' + esc(r.email) + '</td>' +
          '<td style="text-align:center;font-family:var(--font-mono)">' + r.hours_per_week + 'h</td>' +
          '<td><span class="commitment-bar"><span class="commitment-fill" style="width:' + commitPct + '"></span></span>' + r.commitment_level + '/10</td>' +
          '<td style="text-align:center">' + (r.available_72h ? '<span style="color:var(--color-accent-green)">Sim</span>' : '<span style="color:var(--color-danger)">Nao</span>') + '</td>' +
          '<td><span class="badge badge-' + r.phase + '">' + phaseLabel(r.phase) + '</span></td>' +
          '<td><button class="btn btn-ghost btn-sm" onclick="openDetail(\'' + r.id + '\')">Ver</button></td>' +
          '</tr>';
      }).join('');
    }

    function phaseLabel(p) {
      var labels = { applied: 'Candidato', approved: 'Aprovado', sprint_active: 'Sprint', submitted: 'Entregou', evaluated: 'Avaliado', rejected: 'Rejeitado' };
      return labels[p] || p;
    }

    function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    // ── Detail Modal ──
    function openDetail(id) {
      var r = allData.find(function(x) { return x.id === id; });
      if (!r) return;

      var tools = (r.tools_known || []).join(', ');
      if (r.tools_other) tools += (tools ? ', ' : '') + r.tools_other;

      var html = '<h2>' + esc(r.name) + '<button class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></h2>' +
        '<div class="detail-grid">' +
        '<span class="detail-label">Email</span><span class="detail-value">' + esc(r.email) + '</span>' +
        '<span class="detail-label">WhatsApp</span><span class="detail-value">' + esc(r.phone || '—') + '</span>' +
        '<span class="detail-label">Horas/semana</span><span class="detail-value mono">' + r.hours_per_week + 'h</span>' +
        '<span class="detail-label">Disponivel 72h</span><span class="detail-value">' + (r.available_72h ? 'Sim' : 'Nao') + '</span>' +
        '<span class="detail-label">Compromisso</span><span class="detail-value mono">' + r.commitment_level + '/10</span>' +
        '<span class="detail-label">Papel preferido</span><span class="detail-value">' + esc(r.preferred_role || '—') + '</span>' +
        '<div class="detail-divider"></div>' +
        '<span class="detail-label">Ferramentas</span><span class="detail-value">' + esc(tools || '—') + '</span>' +
        '<span class="detail-label">Maior build</span><span class="detail-value">' + esc(r.biggest_build || '—') + '</span>' +
        '<span class="detail-label">Motivacao</span><span class="detail-value">' + esc(r.motivation || '—') + '</span>' +
        '<div class="detail-divider"></div>' +
        '<span class="detail-label">Fase atual</span><span class="detail-value"><span class="badge badge-' + r.phase + '">' + phaseLabel(r.phase) + '</span></span>' +
        '<span class="detail-label">Candidatou em</span><span class="detail-value">' + new Date(r.created_at).toLocaleDateString('pt-BR') + '</span>' +
        '</div>';

      // Phase actions
      if (r.phase === 'applied') {
        html += '<div style="display:flex;gap:0.5rem;margin-bottom:1.5rem">' +
          '<button class="btn btn-primary" onclick="updatePhase(\'' + r.id + '\',\'approved\')">Aprovar para Sprint</button>' +
          '<button class="btn btn-ghost" style="border-color:var(--color-danger);color:var(--color-danger)" onclick="updatePhase(\'' + r.id + '\',\'rejected\')">Rejeitar</button>' +
          '</div>';
      } else if (r.phase === 'approved') {
        html += '<button class="btn btn-primary" onclick="updatePhase(\'' + r.id + '\',\'sprint_active\')" style="margin-bottom:1.5rem">Iniciar Sprint 72h</button>';
      } else if (r.phase === 'sprint_active') {
        html += '<button class="btn btn-primary" onclick="updatePhase(\'' + r.id + '\',\'submitted\')" style="margin-bottom:1.5rem">Marcar como Entregue</button>';
      }

      // Scoring section (for submitted or evaluated)
      if (['submitted', 'evaluated'].includes(r.phase)) {
        html += '<h3 style="font-size:1rem;margin-bottom:1rem;color:var(--color-maker)">Avaliacao do Sprint</h3>' +
          '<div class="score-grid">' +
          scoreField('score_exec', 'Execucao', r.score_execution) +
          scoreField('score_qual', 'Qualidade', r.score_quality) +
          scoreField('score_speed', 'Velocidade', r.score_speed) +
          scoreField('score_comm', 'Comunicacao', r.score_communication) +
          scoreField('score_resrc', 'Resourcefulness', r.score_resourcefulness) +
          '</div>' +
          '<label style="display:block;font-size:0.8rem;color:var(--color-text-muted);margin-bottom:0.3rem">Veredicto</label>' +
          '<select class="verdict-select" id="modal-verdict">' +
          '<option value="">Selecione...</option>' +
          '<option value="maker_confirmed"' + (r.verdict === 'maker_confirmed' ? ' selected' : '') + '>Maker Confirmado</option>' +
          '<option value="needs_development"' + (r.verdict === 'needs_development' ? ' selected' : '') + '>Precisa Desenvolvimento</option>' +
          '<option value="not_maker"' + (r.verdict === 'not_maker' ? ' selected' : '') + '>Nao e Maker</option>' +
          '</select>' +
          '<label style="display:block;font-size:0.8rem;color:var(--color-text-muted);margin-bottom:0.3rem">Notas do avaliador</label>' +
          '<textarea class="notes-textarea" id="modal-notes" placeholder="Observacoes sobre o candidato...">' + esc(r.evaluator_notes || '') + '</textarea>' +
          '<div class="modal-actions">' +
          '<button class="btn btn-primary" onclick="saveEvaluation(\'' + r.id + '\')">Salvar Avaliacao</button>' +
          '</div>';
      }

      document.getElementById('modal-content').innerHTML = html;
      document.getElementById('modal-overlay').classList.add('visible');
    }

    function scoreField(id, label, value) {
      return '<div class="score-field"><label>' + label + ' (0-10)</label><input type="number" id="' + id + '" min="0" max="10" value="' + (value || '') + '"></div>';
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('visible');
    }

    document.getElementById('modal-overlay').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    // ── Phase Update ──
    async function updatePhase(id, newPhase) {
      var update = { phase: newPhase };
      if (newPhase === 'sprint_active') {
        update.sprint_started_at = new Date().toISOString();
        update.sprint_deadline_at = new Date(Date.now() + 72 * 60 * 60 * 1000).toISOString();
      }
      if (newPhase === 'submitted') {
        update.sprint_submitted_at = new Date().toISOString();
      }

      var result = await sb.from('maker_challenge').update(update).eq('id', id);
      if (result.error) { alert('Erro: ' + result.error.message); return; }

      closeModal();
      loadData();
    }

    // ── Save Evaluation ──
    async function saveEvaluation(id) {
      var exec = parseInt(document.getElementById('score_exec').value) || 0;
      var qual = parseInt(document.getElementById('score_qual').value) || 0;
      var speed = parseInt(document.getElementById('score_speed').value) || 0;
      var comm = parseInt(document.getElementById('score_comm').value) || 0;
      var resrc = parseInt(document.getElementById('score_resrc').value) || 0;
      var total = ((exec + qual + speed + comm + resrc) / 5).toFixed(1);

      var update = {
        score_execution: exec,
        score_quality: qual,
        score_speed: speed,
        score_communication: comm,
        score_resourcefulness: resrc,
        total_score: parseFloat(total),
        verdict: document.getElementById('modal-verdict').value || null,
        evaluator_notes: document.getElementById('modal-notes').value.trim() || null,
        phase: 'evaluated'
      };

      var result = await sb.from('maker_challenge').update(update).eq('id', id);
      if (result.error) { alert('Erro: ' + result.error.message); return; }

      closeModal();
      loadData();
    }
  </script>
</body>
</html>
